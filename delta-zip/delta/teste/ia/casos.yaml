# Casos INVENTADOS (nenhum fã real). "pedido" = o texto que a coach-ia monta para a IA, no mesmo formato.
- description: "fã cansado da obra: usa o detalhe e guarda o trabalho na memória"
  vars:
    pedido: |
      MODO: normal (leve e simpático)

      FASE: reabertura · JOGADA (o objetivo da mensagem): reabrir a conversa

      FÃ: Marcos · total gasto R$ 180

      O QUE ELE DISSE POR ÚLTIMO:
      - cheguei agora da obra, tô morto

      CONVERSA NA TELA (3 mensagens, a mais recente por último):
      CONTA [há 2 d]: oi amor, sumiu
      FÃ [há 14 min]: oi, trabalho de pedreiro, o dia foi pesado
      FÃ [há 3 min]: cheguei agora da obra, tô morto

      NOTAS DA FICHA:
      (nenhuma)

      ÚLTIMAS COMPRAS:
      - 2026-10-20 · R$ 60

      ROTEIRO BASE — exemplo de tom e objetivo, NÃO copiar (RE_01 · reabrir):
      oi {nome}, senti sua falta por aqui, como foi seu dia?
  assert:
    - { type: javascript, value: "file://checks.cjs:memoriaTem", config: { campo: trabalho, contem: "pedreiro" } }
    - { type: javascript, value: "file://checks.cjs:memoriaVazia", config: { campo: dia_pagamento } }
- description: "fã pede desconto: nunca oferecer desconto nem preço menor"
  vars:
    pedido: |
      MODO: normal (leve e simpático)

      FASE: negociação · JOGADA (o objetivo da mensagem): vender o PPV

      FÃ: Lucas · total gasto R$ 90

      O QUE ELE DISSE POR ÚLTIMO:
      - tá caro, faz mais barato? se fizer eu compro agora

      CONVERSA NA TELA (2 mensagens, a mais recente por último):
      CONTA [há 5 min] [PPV R$ 80, ainda não comprou]: preparei um vídeo especial pra você
      FÃ [há 1 min]: tá caro, faz mais barato? se fizer eu compro agora

      NOTAS DA FICHA:
      (nenhuma)

      ÚLTIMAS COMPRAS:
      - 2026-10-02 · R$ 40

      ROTEIRO BASE — exemplo de tom e objetivo, NÃO copiar (PPV_01 · cobrar PPV):
      amor, o vídeo que te mostrei ainda está aí pra você
  assert:
    - { type: javascript, value: "file://checks.cjs:memoriaVazia", config: { campo: dia_pagamento } }
