<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Delta · prévia do Modo Palco</title>
<!--
  Prévia do Modo Palco (v2.3), sem abrir Chrome por cima de nada e sem internet.
  Abra pelo servidor da prévia: node teste/previa/servidor.mjs → http://127.0.0.1:4391/teste/previa/palco.html
  Tela de 1440 × 860: à esquerda uma Privacy DE MENTIRA (827 px, lista + conversa juntas), à direita o painel do Delta
  DE VERDADE (613 px, o que sobra) de cada modelo, os 3 empilhados no mesmo lugar. Clique no nome de outra modelo no topo do Delta
  (ou Alt+1/2/3): esta página faz o papel do ajudante trocar_modelo.ps1 — lê o pedido no título da janelinha e traz a
  Privacy + o Delta daquela modelo para a frente.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0809; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; color: #f5eef2; }
  #tela { position: relative; width: 1440px; height: 860px; overflow: hidden; background: #000; }
  .priv { position: absolute; left: 0; top: 0; width: 827px; height: 860px; display: none; flex-direction: column; background: #f6f2ee; color: #2a2226; }
  .priv.on { display: flex; }
  .priv .barra { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #fff; border-bottom: 1px solid #e6dfda; font-size: 12px; color: #6b5d63; }
  .priv .barra i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .priv .corpo { flex: 1; display: grid; grid-template-columns: 330px 1fr; min-height: 0; }
  .lista { border-right: 1px solid #e6dfda; overflow: hidden; background: #fbf9f7; }
  .lista h3 { margin: 0; padding: 14px 16px 8px; font-size: 15px; }
  .sala { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid #f0ebe7; }
  .sala.aberta { background: #f1e7ea; }
  .av { width: 38px; height: 38px; border-radius: 50%; background: #e8dde1; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #7a5965; }
  .sala b { display: block; font-size: 13px; }
  .sala small { color: #8a7c82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; max-width: 190px; }
  .nl { min-width: 20px; height: 20px; border-radius: 10px; background: #ff7a2f; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat header { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 18px; border-bottom: 1px solid #e6dfda; background: #fff; font-weight: 700; }
  .msgs { flex: 1; padding: 18px 24px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .m { max-width: 60%; padding: 8px 12px; border-radius: 14px; background: #ebe4e0; }
  .m.nossa { align-self: flex-end; background: #ffcfae; }
  .campo { margin: 12px 18px 16px; padding: 12px 14px; border-radius: 22px; background: #fff; border: 1px solid #e6dfda; color: #9a8d92; }
  iframe { position: absolute; left: 827px; top: 0; width: 613px; height: 860px; border: 0; visibility: hidden; background: #0e0a0d; }
  iframe.on { visibility: visible; }
  #legenda { padding: 10px 14px; font-size: 13px; color: #cbbcc3; }
  #legenda b { color: #f0c86e; }
</style>
</head>
<body>
<div id="tela"></div>
<p id="legenda">Prévia com dados de mentira. Clique em outra modelo no topo do Delta (ou Alt+1/2/3). Ativa agora: <b id="ativa">—</b></p>
<script>
  // conta → cena da prévia (mesmos cenários do shim.js) e uma lista de conversas de mentira para a Privacy da esquerda
  const MODELOS = [
    { conta: "arrudafree", cena: "vip", fa: "Carlos Mendes", msgs: [["senti sua falta, Carlos 😘", 1], ["tava viajando a trabalho", 0], ["obra nova em Recife", 0], ["e deu tudo certo lá?", 1], ["deu sim, cheguei hoje", 0], ["queria ver aquele que você falou", 0]] },
    { conta: "xlunavitaligratis", cena: "ppv", fa: "Rafa Moreira", msgs: [["oi", 0], ["oi Rafa 😏", 1], ["tem novidade?", 0], ["tô curioso", 0], ["manda", 0], ["olha o que eu separei pra você · R$ 129,90", 1]] },
    { conta: "louisefree", cena: "novo", fa: "João Teste", msgs: [["oi amor, tudo bem? 😘", 1], ["oi linda", 0], ["que bom te ver aqui", 1], ["cheguei do trabalho agora", 0], ["hoje foi puxado", 0], ["você é diferente", 0]] }
  ];
  const OUTRAS = [["Dante", "Vida? Rs", 4], ["Socram", "Boa noite, aprontando o quê?", 3], ["Piter", "Bom dia meu amor", 1], ["Santos", "te mandei", 0], ["Wesley", "Oii", 1], ["Gabi", "kkkk", 0], ["Lepo", "e aí", 2]];
  const tela = document.getElementById("tela"), visto = {};
  let R = null, ativa = null;
  const iniciais = (n) => n.split(/\s+/).map((p) => p[0]).join("").slice(0, 2).toUpperCase();

  function montar() {
    MODELOS.forEach((m) => {
      const cfg = R.config_por_conta[m.conta] || {};
      const priv = document.createElement("div");
      priv.className = "priv"; priv.dataset.conta = m.conta; priv.style.setProperty("--c", cfg.cor || "#8b1e3f");
      priv.innerHTML = `<div class="barra"><i></i>Privacy | Chat — ${cfg.rotulo || m.conta} (@${m.conta}) · Web App de 827 px</div>
        <div class="corpo"><div class="lista"><h3>Conversas</h3>
          <div class="sala aberta"><div class="av">${iniciais(m.fa)}</div><div><b>${m.fa}</b><small>${m.msgs[m.msgs.length - 1][0]}</small></div><span></span></div>
          ${OUTRAS.map(([n, u, k]) => `<div class="sala"><div class="av">${iniciais(n)}</div><div><b>${n}</b><small>${u}</small></div>${k ? `<span class="nl">${k}</span>` : "<span></span>"}</div>`).join("")}
        </div><div class="chat"><header><div class="av">${iniciais(m.fa)}</div>${m.fa}</header>
          <div class="msgs">${m.msgs.map(([t, nossa]) => `<div class="m${nossa ? " nossa" : ""}">${t}</div>`).join("")}</div>
          <div class="campo">Digite uma mensagem</div></div></div>`;
      tela.append(priv);
      const f = document.createElement("iframe");
      f.dataset.conta = m.conta; f.title = "Delta · " + (cfg.rotulo || m.conta);
      f.src = `/painel?c=${m.cena}&conta=${m.conta}&palco=1`;
      tela.append(f);
    });
    ativar(MODELOS[0].conta);
    setInterval(vigiar, 150);
  }
  // o papel do trocar_modelo.ps1: lê "Delta · Arruda » Luna #123" no título de cada janelinha e troca
  function vigiar() {
    tela.querySelectorAll("iframe").forEach((f) => {
      let t = ""; try { t = f.contentDocument.title; } catch (_) { return; }
      const m = /^Delta · (.+?) » (.+?) #(\d+)/.exec(t);
      if (!m || visto[f.dataset.conta] === m[3]) return;
      visto[f.dataset.conta] = m[3];
      const alvo = Object.keys(R.config_por_conta).find((k) => R.config_por_conta[k].rotulo === m[2]);
      if (alvo) ativar(alvo);
    });
  }
  function ativar(conta) {
    ativa = conta;
    tela.querySelectorAll(".priv,iframe").forEach((x) => x.classList.toggle("on", x.dataset.conta === conta));
    const f = tela.querySelector(`iframe[data-conta="${conta}"]`);
    setTimeout(() => { try { f.contentWindow.focus(); } catch (_) {} }, 30); // a janelinha anterior perde o foco: o painel sabe que trocou
    document.getElementById("ativa").textContent = (R.config_por_conta[conta] || {}).rotulo || conta;
  }
  document.addEventListener("keydown", (e) => {
    if (e.altKey && /^[1-9]$/.test(e.key)) { const c = (R.palco.teclas || [])[Number(e.key) - 1]; if (c) { e.preventDefault(); ativar(c); } }
  });
  fetch("/coach-ext/data/coach_regras.json").then((r) => r.json()).then((j) => { R = j; montar(); });
  window.__palco = { ativar, get ativa() { return ativa; } };
</script>
</body>
</html>
